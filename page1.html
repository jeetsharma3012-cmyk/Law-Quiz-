<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101a2e" />
  <title>Quizly — Get started</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse at 75% 48%, rgba(20, 184, 166, 0.16), transparent 42%),
        #101a2e;
      color: #eef2f7;
      font-family: Arial, sans-serif;
    }

    header, footer {
      width: min(100% - 40px, 1080px);
      margin: 0 auto;
    }

    header {
      height: 76px;
      display: flex;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: inherit;
      font-size: 21px;
      font-weight: 700;
      text-decoration: none;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #14b8a6;
      color: #10202b;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 44px 20px 70px;
      text-align: center;
    }

    .welcome {
      width: min(100%, 620px);
    }

    .welcome-icon {
      width: 66px;
      height: 66px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 21px;
      border: 1px solid rgba(242, 189, 99, 0.35);
      background: rgba(20, 184, 166, 0.12);
      color: #f2bd63;
      font-size: 26px;
    }

    h1 {
      font-size: clamp(38px, 7vw, 62px);
      line-height: 1.08;
      letter-spacing: -2.5px;
    }

    h1 span {
      color: #f2bd63;
    }

    .intro {
      max-width: 430px;
      margin: 18px auto 28px;
      color: #a6b2c2;
      font-size: 16px;
      line-height: 1.7;
    }

    .name-form {
      width: min(100%, 365px);
      margin: 0 auto;
      text-align: left;
    }

    .name-form label {
      display: block;
      margin-bottom: 8px;
      color: #d4dce8;
      font-size: 13px;
      font-weight: 700;
    }

    .name-form input {
      width: 100%;
      height: 50px;
      margin-bottom: 13px;
      padding: 0 15px;
      border: 1px solid #33435c;
      border-radius: 11px;
      outline: none;
      background: #1b2940;
      color: #eef2f7;
      font-size: 15px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .name-form input::placeholder {
      color: #8797ad;
    }

    .name-form input:focus {
      border-color: #14b8a6;
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.16);
    }

    .get-started {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 25px;
      border: 0;
      border-radius: 13px;
      background: #14b8a6;
      color: #10202b;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 9px 22px rgba(0, 0, 0, 0.25);
      transition: background 160ms ease, transform 160ms ease;
      text-decoration: none;
    }

    .get-started:hover {
      transform: translateY(-2px);
      background: #35cbb8;
      color: #10202b;
    }

    footer {
      padding: 20px 0 24px;
      border-top: 1px solid rgba(212, 220, 232, 0.12);
      color: #8797ad;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      header, footer {
        width: calc(100% - 32px);
      }

      main {
        padding: 35px 20px 52px;
      }

      h1 {
        letter-spacing: -1.7px;
      }

      .intro {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="#" aria-label="Quizly home">
      <span class="brand-mark" aria-hidden="true">Q</span>
      <span>quizly</span>
    </a>
  </header>

  <main>
    <section class="welcome" id="welcome">
      <div class="welcome-icon" aria-hidden="true">✨</div>
      <h1>Ready to test your <span>legal knowledge?</span></h1>
      <p class="intro">Enter your name and take on ten questions made for curious law students.</p>
      <form class="name-form" id="name-form">
        <label for="player-name">Your name</label>
        <input id="player-name" name="name" type="text" placeholder="Enter your name" maxlength="40" autocomplete="name" required />
        <button class="get-started" type="submit">Get Started <span aria-hidden="true">→</span></button>
      </form>
    </section>
  </main>

  <footer>Made for curious minds.</footer>
  <script>
    const nameInput = document.getElementById("player-name");
    nameInput.addEventListener("input", () => nameInput.setCustomValidity(""));

    document.getElementById("name-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.setCustomValidity("Please enter your name to start the quiz.");
        nameInput.reportValidity();
        return;
      }
      window.location.href = `page2.html?name=${encodeURIComponent(name)}`;
    });
  </script>
</body>
</html>
